<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task20</title>
    <style>
        div.color{
        width: 100px;
        height: 100px;
        background-color: blue;
        transition-duration: 2s;
        transition-delay: 1s;
        }
        div.color:hover{
            width: 200px;
            height: 200px;
            background-color: navy;
            border: 2px solid black;

        }
        button.first{
            width: 100px;
            background-color: green;
            transition-duration: 1s;            
        }
        button.first:hover{
            width: 200px;
            background-color: greenyellow;

        }
        div.box{
            width: 100px;
            height: 100px;
            background-color: black;
            color: white;
        }
        div.box:hover{
            width: 100px;
            height: 100px;
            color: red;
            border: 2px solid black;
            background-color: white;
            transition-timing-function: linear;
        }
        p:hover{
            color: navy;
            border: 1px solid;
            transition-delay: 1s;
        }
        div.box2{
            background-color: brown;
            border: 1px solid black;
            width: 100px;
            height: 100px;
        }
        div.box2:hover{
            background-color: rgb(145, 64, 64);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            transition: 0.5 ease;
        }
        button.second{
            background-color: blue;
            color: white;
            width: 100px;
            height: 100px;
        }
        button.second:hover{
            background-color: lightblue;
            color: black;
            width: 100px;
            height: 100px;
            transition: all 1s ease 1.5s;
        }
        div.first{
            background-color: green;
            color: black;
            width: 100px;
            height: 100px;
        }
        div.first:hover{
            background-color: lightgreen;
            color: black;
            width: 100px;
            height: 100px;
            margin-left: 20%;
            transition-duration: 5s;
            transition-delay: 1s;
            transition-timing-function: ease-in;
        }
        div.second{
            width:100px;
            height: 100px;
            border: 1px;
            background-color: green;
        }
        div.second:hover{
            width:100px;
            height: 100px;
            border: 1px;
            background-color: green;
             box-shadow:  20px 0 10px lightgreen;
        }
        div.opacity{
            opacity: 0.2;
            width: 100px;
            height: 100px;
            background-color: red;
        }
        div.opacity:hover{
            opacity: 1;
            width: 100px;
            height: 100px;
            background-color: red;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>
    <div  class="color">colour</div>
    <button class="first">width</button>
    <div class="box">box</div>
    <p>hello! I am going to change the color.</p>
    <div class="box2">box2</div>
    <button class="second">button 2</button>
    <div class="first">left to right</div>
    <div class="second">shadow</div>
    <div class="opacity">opacity</div>

</body>
</html>
